# 앱 화면 글꼴(2026-09-29): 모든 화면 글자를 Noto Sans KR 로 통일한다(PC·클라우드·폰 같은 글꼴).
# 글꼴 파일은 static/ 에서 내려준다(Streamlit 정적 파일 제공은 앱 옆 static 폴더만 가능 -> fonts/ 와 같은 파일을 복사해 둠).
# 크기: 제목 h1~h4 = 12pt(16px). 본문·캡션·표 11pt(14.67px)는 app.py 의 APP_FONT_CSS 로 맞춘다
# (theme.baseFontSize 는 정수 px 이고 버튼·입력창까지 함께 바뀌므로 쓰지 않는다).

[server]
enableStaticServing = true

[theme]
font = "Noto Sans KR"
headingFont = "Noto Sans KR"
headingFontSizes = ["16px", "16px", "16px", "16px"]

[theme.sidebar]
headingFontSizes = ["16px", "16px", "16px", "16px"]

[[theme.fontFaces]]
family = "Noto Sans KR"
url = "app/static/NotoSansKR-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Noto Sans KR"
url = "app/static/NotoSansKR-Bold.ttf"
weight = 700
